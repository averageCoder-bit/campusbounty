name: CampusBounty CI

on:
    push:
        branches:
            - main
            - develop
            - "feature/**"
    pull_request:
        branches:
            - main
            - develop

permissions:
    contents: read

jobs:
    frontend-build:
        name: Build Phaser + React
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build game
              run: npm run build-nolog

    backend-syntax:
        name: Check Python backend
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Check Python syntax
              run: python -m compileall -q backend/app
